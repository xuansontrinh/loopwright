name: Publish to npm

# main is protected (PRs only), so a release is a merged PR that bumps package.json "version".
# After CI passes on a push to main, this workflow releases that commit's version if it hasn't
# been released yet: `npm stage publish` (trusted publishing / OIDC), then the vX.Y.Z tag and
# GitHub release. Staged versions are not installable until a maintainer approves them with 2FA
# on npmjs.com (CI cannot approve); a direct `npm publish` from CI is deliberately not allowed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # retry a failed release of main's head from the Actions tab

permissions:
  id-token: write # npm trusted publishing
  contents: write # create the tag and GitHub release
  actions: read # look up CI results for workflow_dispatch

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Release package.json version
    # Only a successful CI run for a push to main (not a PR whose branch happens to be named main).
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # The exact commit CI tested (workflow_run) or main's head (manual retry).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Require passing CI for this commit (manual retry)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --workflow ci.yml --commit "$SHA" --event push --status success --json databaseId --jq 'length')
          if [ "$ok" = "0" ]; then
            echo "::error::No successful CI run for a push of $SHA; not releasing."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The GitHub release marks a version as handled: it is created right after a successful
      # stage (or for a version already live on npm). CI cannot query staged versions, so this
      # is what keeps a re-run from staging the same version twice.
      - name: Detect unreleased version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          on_npm=false; npm view "loopwright@$version" version >/dev/null 2>&1 && on_npm=true
          released=false; gh release view "v$version" >/dev/null 2>&1 && released=true
          echo "on_npm=$on_npm" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "Version 0.0.0 is the unreleased placeholder; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$released" = true ]; then
            echo "v$version already has a GitHub release (live on npm: $on_npm); nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # A leftover remote tag on another commit would make the release point at the wrong code.
            tags=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}") || {
              echo "::error::git ls-remote failed; cannot verify tag v$version."
              exit 1
            }
            tag_sha=$(echo "$tags" | awk '/\^\{\}$/ {p=$1} !/\^\{\}$/ && NF {l=$1} END {print p ? p : l}')
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$SHA" ]; then
              echo "::error::Remote tag v$version points at $tag_sha, not $SHA; delete or fix the tag."
              exit 1
            fi
            echo "Releasing v$version (live on npm: $on_npm)."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # CI already ran typecheck + tests for this commit; only the build is needed here.
      # `npm stage` needs npm >= 11.15.0; pin it rather than depend on what Node 24 bundles.
      # A version already live on npm (e.g. published by hand) is not staged again.
      - name: Build and stage on npm
        if: steps.check.outputs.release == 'true' && steps.check.outputs.on_npm == 'false'
        run: |
          npm ci --ignore-scripts
          npm run build
          npm install -g npm@11.15.0
          npm stage publish --access public

      # Runs only after a successful stage, so a failed stage leaves no tag and can be retried.
      - name: Tag and create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          ON_NPM: ${{ steps.check.outputs.on_npm }}
        run: |
          if [ "$ON_NPM" = true ]; then
            notes="Install: \`npx loopwright@$VERSION init\`"
          else
            notes="Staged on npm: installable once a maintainer approves it (npmjs.com → loopwright → Staged Packages). Then: \`npx loopwright@$VERSION init\`"
          fi
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes "$notes" --generate-notes
