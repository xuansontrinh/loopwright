name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Run only on PRs labeled "Request Review From Claude". remove-label drops the
    # label after a successful review, so each review needs the label added again.
    # If a review fails, the label stays and the next push retries.
    # Adding other labels does not trigger a run.
    if: |
      github.event.action == 'labeled' && github.event.label.name == 'Request Review From Claude' ||
      github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'Request Review From Claude')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@7ca5eaf924c29f3c471600c72f9964e8c5534190 # v1.0.274
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --effort: https://code.claude.com/docs/en/cli-reference (CLI flags)
          claude_args: '--model claude-opus-5-5 --effort high --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  remove-label:
    needs: claude-review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # https://docs.github.com/en/rest/issues/labels#remove-a-label-from-an-issue
        # If the delete fails (404 when someone already removed the label), pass
        # only when the label is confirmed gone.
        run: |
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/Request%20Review%20From%20Claude" --silent; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
            if grep -qx 'Request Review From Claude' <<<"$labels"; then exit 1; fi
          fi
